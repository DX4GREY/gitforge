<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GitForge Quick Launcher</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      background-color: #090d16;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .logo {
      font-size: 16px;
      font-weight: 700;
      color: #3b82f6;
    }
    input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #1f293d;
      background: #111827;
      color: #f3f4f6;
      margin-bottom: 10px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: none;
      background: #3b82f6;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">⚡ GitForge</span>
  </div>
  <p style="font-size: 12px; color: #9ca3af; margin-top: 0;">Customize GitHub profile in 1-click</p>
  <input type="text" id="username" placeholder="GitHub Username (e.g. octocat)" />
  <button id="launchBtn">Generate Profile</button>
  <script src="popup.js"></script>
</body>
</html>
